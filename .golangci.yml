version: "2"

run:
  timeout: 5m
  tests: true
  go: "1.26"

linters:
  default: standard
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    errcheck:
      check-blank: true
      check-type-assertions: true
    govet:
      enable-all: true
    staticcheck:
      checks:
        - all
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
